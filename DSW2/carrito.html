<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Tienda Sara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Tienda Sara</a>
            <a href="galeria.html" class="btn btn-outline-light">Seguir comprando</a>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4">Tu carrito de compras</h2>
        <div class="row">
            <div class="col-md-8">
                <div class="card p-3 shadow-sm mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5>Televisor 55 pulgadas</h5>
                            <p class="text-muted mb-0">Precio unitario: $12,999.99</p>
                        </div>
                        <div>
                            <input type="number" class="form-control d-inline-block text-center" value="1" style="width: 70px;">
                        </div>
                        <span class="fw-bold">$12,999.99</span>
                        <button class="btn btn-outline-danger btn-sm">Eliminar</button>
                    </div>
                </div>
            </div>
            <!-- Resumen de Compra -->
            <div class="col-md-4">
                <div class="card p-4 shadow-sm bg-light">
                    <h4>Resumen de compra</h4>
                    <hr>
                    <p class="d-flex justify-content-between"><span>Subtotal:</span> <span>$12,999.99</span></p>
                    <p class="d-flex justify-content-between text-success"><span>Envío:</span> <span>¡Gratis!</span></p>
                    <h3 class="d-flex justify-content-between fw-bold"><span>Total:</span> <span>$12,999.99</span></h3>
                    <button class="btn btn-primary w-100 mt-3 py-2 fw-bold">PROCEDER AL PAGO</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
